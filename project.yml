name: Whereabouts
options:
  bundleIdPrefix: com.whereabouts
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  Whereabouts:
    type: application
    platform: iOS
    sources: [Whereabouts]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        APP_DISPLAY_NAME: Whereabouts
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: com.whereabouts.app
        INFOPLIST_FILE: Whereabouts/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  WhereaboutsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WhereaboutsTests]
    dependencies:
      - target: Whereabouts
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  WhereaboutsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WhereaboutsUITests]
    dependencies:
      - target: Whereabouts
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Whereabouts:
    build:
      targets:
        Whereabouts: all
    test:
      targets: [WhereaboutsTests, WhereaboutsUITests]
