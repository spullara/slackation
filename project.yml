name: Slackation
options:
  bundleIdPrefix: com.slackation
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  Slackation:
    type: application
    platform: iOS
    sources: [Slackation]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slackation.app
        INFOPLIST_FILE: Slackation/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  SlackationTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SlackationTests]
    dependencies:
      - target: Slackation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Slackation:
    build:
      targets:
        Slackation: all
    test:
      targets: [SlackationTests]
